name: Bug report
description: Something renders wrong, crashes or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: sample
    attributes:
      label: Markdown sample
      description: The smallest Markdown that shows the problem.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Output of `mdpeek --plain --color never FILE` helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mdpeek version
      placeholder: mdpeek 0.1.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and terminal
      placeholder: macOS 26, Ghostty 1.3, inside tmux 3.5
    validations:
      required: true
