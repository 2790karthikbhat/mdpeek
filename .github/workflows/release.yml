name: Release

# Push a tag like v0.1.0 to build every binary and publish the GitHub release that
# scripts/install.sh and scripts/install.ps1 download from.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/mdpeek
          "$bin" --version
          "$bin" --plain --color never fixtures/demo.md | grep -q "mdpeek demo"
      - name: Package
        shell: bash
        run: |
          name=mdpeek-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp LICENSE README.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "../target/${{ matrix.target }}/release/mdpeek.exe" "$name/"
            7z a -tzip "$name.zip" "$name" >/dev/null
            asset="$name.zip"
          else
            cp "../target/${{ matrix.target }}/release/mdpeek" "$name/"
            tar -czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"
          else shasum -a 256 "$asset" > "$asset.sha256"; fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { on = index($0, v) > 0; next }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          cat >> notes.md <<'EOF'

          ## Install

          - macOS / Linux: `curl -fsSL https://raw.githubusercontent.com/2790karthikbhat/mdpeek/main/scripts/install.sh | sh`
          - Windows (PowerShell): `irm https://raw.githubusercontent.com/2790karthikbhat/mdpeek/main/scripts/install.ps1 | iex`
          - With Rust: `cargo install mdpeek`
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "mdpeek $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
